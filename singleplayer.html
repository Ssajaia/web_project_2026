<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single Player - Sharpen Typing</title>
    <link rel="shortcut icon" href="./assets/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="loader" class="loader">
      <div class="loader_inner">
        <span class="loader_name">Sharpen Typing</span>
      </div>
    </div>

    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo">
          <div class="logo_wordmark">
            <span class="logo_name">Sharpen Typing</span>
            <span class="logo_tagline">Speed Test</span>
          </div>
        </a>
        <nav>
          <ul class="nav_links">
            <li><a href="index.html" class="nav_link">Home</a></li>
            <li>
              <a href="singleplayer.html" class="nav_link">Single Player</a>
            </li>
            <li><a href="multiplayer.html" class="nav_link">Multiplayer</a></li>
            <li><a href="leaderboard.html" class="nav_link">Leaderboard</a></li>
            <li><a href="statistics.html" class="nav_link">Statistics</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="container">
        <section class="test-section">
          <div class="controls-bar">
            <div class="mode-selector">
              <button class="mode-selector_btn">30s</button>
              <button class="mode-selector_btn is-active">60s</button>
            </div>
          </div>

          <div class="stats-bar">
            <div class="stat-item stat-item--highlight">
              <output id="timer-display" class="timer-display">01:00</output>
              <span class="stat-item_label">time</span>
            </div>
            <div class="stat-item">
              <output id="wpm-display" class="stat-item_value">-</output>
              <span class="stat-item_label">wpm</span>
            </div>
            <div class="stat-item">
              <output id="accuracy-display" class="stat-item_value">-</output>
              <span class="stat-item_label">accuracy</span>
            </div>
            <div class="stat-item">
              <output id="errors-display" class="stat-item_value">-</output>
              <span class="stat-item_label">errors</span>
            </div>
          </div>

          <div class="typing-display">
            <p id="typing-display-text" class="typing-display_text"></p>

            <div id="result-overlay" class="result-overlay">
              <p class="result-overlay_title">Test complete</p>
              <p class="result-overlay_wpm" id="result-wpm">
                - <span>wpm</span>
              </p>
              <p id="result-accuracy"></p>
              <div class="result-overlay_actions">
                <button class="btn btn--ghost btn--sm" id="overlay-restart-btn">
                  Try again
                </button>
                <a href="leaderboard.html" class="btn btn--ghost btn--sm"
                  >Leaderboard</a
                >
              </div>
            </div>
          </div>

          <div class="typing-input-wrapper">
            <label for="typing-input" class="visually-hidden"
              >Type the text shown above</label
            >
            <input
              type="text"
              id="typing-input"
              name="typing-input"
              class="typing-input"
              placeholder="Start typing to begin…"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>

          <div class="controls-bar">
            <button id="restart-btn" class="btn btn--ghost btn--sm">
              Restart
            </button>
          </div>

          <p class="hint-text" style="margin-top: 1rem">
            <kbd class="kbd">Tab</kbd> or <kbd class="kbd">Esc</kbd> to restart
          </p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="footer-text">© 2025 Sharpen Typing | Saba Sajaia</p>
        <p class="footer-text">
          <a href="leaderboard.html" class="footer-link">Leaderboard</a>
          -
          <a href="statistics.html" class="footer-link">Statistics</a>
        </p>
      </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="js/singleplayer.js"></script>
  </body>
</html>
